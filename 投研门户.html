<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280,initial-scale=1.0">

<style>
/* ========== macOS Design System ========== */
:root {
  --bg:           #F5F5F7;
  --card-bg:      rgba(255,255,255,0.78);
  --sidebar-bg:   rgba(245,245,247,0.85);
  --text:         #1d1d1f;
  --text2:        #6e6e73;
  --text3:        #aeaeb2;
  --blue:         #007AFF;
  --blue-bg:      rgba(0,122,255,0.08);
  --green:        #34C759;
  --green-bg:     rgba(52,199,89,0.08);
  --red:          #FF3B30;
  --red-bg:       rgba(255,59,48,0.08);
  --orange:       #FF9500;
  --orange-bg:    rgba(255,149,0,0.08);
  --teal:         #5AC8FA;
  --teal-bg:      rgba(90,200,250,0.1);
  --purple:       #AF52DE;
  --purple-bg:    rgba(175,82,222,0.08);
  --bdr:          rgba(0,0,0,0.08);
  --shadow-sm:    0 2px 8px rgba(0,0,0,0.04);
  --shadow-md:    0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg:    0 8px 40px rgba(0,0,0,0.08);
  --radius-sm:    10px;
  --radius-md:    14px;
  --radius-lg:    20px;
  --sidebar-w:    220px;
  --transition:   all 0.25s cubic-bezier(0.25,0.1,0.25,1);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
}

.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100vh;
  background: rgba(242,242,247,0.72);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-right: 0.5px solid var(--bdr);
  display: flex; flex-direction: column;
  padding: 12px 10px; z-index: 100;
}
.side-hd { padding: 8px 10px 20px; display: flex; align-items: center; gap: 10px; }
.side-icon { width:36px;height:36px;background:linear-gradient(135deg,#007AFF,#5856D6);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700; }
.side-hd .st { font-size:14px;font-weight:600;color:var(--text); }
.side-hd .sv { font-size:10px;color:var(--text3); }
.side-nav { flex:1;display:flex;flex-direction:column;gap:2px; }
.side-btn {
  display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:transparent;
  border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;
  font-family:inherit;transition:var(--transition);text-align:left;width:100%;
}
.side-btn:hover { background:rgba(0,0,0,0.05);color:var(--text); }
.side-btn.active { background:rgba(255,255,255,0.75);box-shadow:var(--shadow-sm);color:var(--blue);font-weight:600; }
.side-btn .sb-icon { font-size:16px;width:22px;text-align:center;flex-shrink:0; }
.side-btn .sb-badge { margin-left:auto;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--blue-bg);color:var(--blue); }
.side-btn.active .sb-badge { background:var(--blue);color:#fff; }
.side-ft { padding:10px 12px;font-size:10px;color:var(--text3);border-top:0.5px solid var(--bdr);margin-top:4px; }

.main-wrap { flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden; }
.topbar {
  height:52px;min-height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;background:rgba(255,255,255,0.55);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom:0.5px solid var(--bdr);z-index:50;
}
.traffic { display:flex;gap:7px; }
.traffic span { width:12px;height:12px;border-radius:50%;display:inline-block; }
.traffic .tr { background:#FF5F57; }.traffic .ty { background:#FEBC2E; }.traffic .tg { background:#28C840; }
.topbar .tp-title { font-size:13px;font-weight:600;color:var(--text); }
.topbar .tp-meta { display:flex;gap:20px;font-size:11px;color:var(--text2); }
.topbar .tp-meta b { color:var(--text);margin-right:2px; }

.content { flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 24px 32px;scroll-behavior:smooth; }
.content::-webkit-scrollbar { width:5px; }
.content::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.12);border-radius:10px; }

/* KPI strip */
.kpi-strip {
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;
}
.kpi-item {
  background:var(--card-bg);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:var(--radius-md);border:0.5px solid var(--bdr);
  padding:16px 20px;text-align:center;
}
.kpi-item .kv { font-size:28px;font-weight:700;letter-spacing:-0.5px; }
.kpi-item .kl { font-size:10.5px;color:var(--text2);margin-top:2px;font-weight:500; }

/* Cards */
.card-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:18px; }
.mac-card {
  background:var(--card-bg);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:var(--radius-md);border:0.5px solid var(--bdr);
  padding:18px 20px;cursor:pointer;transition:var(--transition);box-shadow:var(--shadow-sm);
}
.mac-card:hover { box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:rgba(0,0,0,0.12); }
.mac-card .mc-row1 { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px; }
.mac-card .mc-title { font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px; }
.mac-card .mc-val { font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.5px; }
.mac-card .mc-desc { font-size:11px;color:var(--text2);line-height:1.6; }
.mac-card .mc-tags { display:flex;gap:5px;flex-wrap:wrap;margin-top:10px; }

.pill {
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:500;
}
.pill-green{background:var(--green-bg);color:var(--green)}.pill-red{background:var(--red-bg);color:var(--red)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}.pill-blue{background:var(--blue-bg);color:var(--blue)}
.pill-purple{background:var(--purple-bg);color:var(--purple)}.pill-teal{background:var(--teal-bg);color:var(--teal)}

/* Cycle judgment hero */
.cycle-hero {
  background:linear-gradient(135deg,rgba(0,122,255,0.06),rgba(175,82,222,0.06));
  border-radius:var(--radius-lg);border:0.5px solid var(--bdr);
  padding:20px 24px;margin-bottom:18px;
}
.cycle-hero .ch-row { display:flex;align-items:center;gap:24px;flex-wrap:wrap; }
.cycle-hero .ch-phase {
  font-size:15px;font-weight:700;color:var(--purple);
  padding:8px 20px;background:var(--purple-bg);border-radius:12px;
}
.cycle-hero .ch-desc { flex:1;font-size:12px;color:var(--text2);line-height:1.8;min-width:200px; }
.cycle-hero .ch-desc b { color:var(--text); }
.cycle-hero .ch-models { display:flex;gap:12px;flex-wrap:wrap; }
.cycle-hero .ch-model {
  background:rgba(255,255,255,0.6);border-radius:var(--radius-sm);
  padding:10px 14px;text-align:center;border:0.5px solid var(--bdr);min-width:100px;
}
.cycle-hero .ch-model .cm-name { font-size:10px;color:var(--text3);margin-bottom:2px; }
.cycle-hero .ch-model .cm-phase { font-size:13px;font-weight:600; }
.cycle-hero .ch-model .cm-bar {
  margin-top:4px;height:4px;border-radius:2px;background:rgba(0,0,0,0.06);overflow:hidden;
}
.cycle-hero .ch-model .cm-fill { height:100%;border-radius:2px;transition:width 0.5s ease; }

/* Section / Accordion */
.section {
  background:var(--card-bg);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:var(--radius-lg);border:0.5px solid var(--bdr);
  margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-sm);
}
.sec-hd { padding:13px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:background 0.15s; }
.sec-hd:hover { background:rgba(0,0,0,0.02); }
.sec-hd .sh-title { font-size:13px;font-weight:600;color:var(--text); }
.sec-hd .sh-chevron { font-size:11px;color:var(--text3);transition:transform 0.3s ease; }
.sec-hd.open .sh-chevron { transform:rotate(90deg); }
.sec-bd { display:none;padding:0 22px 18px; }
.sec-bd.open { display:block;animation:fadeIn 0.25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

.chart-row { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0; }
.chart-row3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:8px 0; }
.chart-box { width:100%;height:300px; }
@media(max-width:1100px){.chart-row3{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.chart-row,.chart-row3{grid-template-columns:1fr}}

.mac-tbl { width:100%;font-size:12px;border-collapse:separate;border-spacing:0; }
.mac-tbl th { text-align:left;padding:8px 14px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;border-bottom:0.5px solid var(--bdr); }
.mac-tbl td { padding:9px 14px;border-bottom:0.5px solid rgba(0,0,0,0.04); }
.mac-tbl tr:hover td { background:rgba(0,0,0,0.015); }
.mac-tbl tr:last-child td { border-bottom:none; }

.deep-links { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--bdr); }
.deep-link {
  display:inline-flex;align-items:center;gap:5px;padding:6px 14px;
  background:rgba(0,122,255,0.06);border:0.5px solid rgba(0,122,255,0.15);
  border-radius:20px;font-size:11px;font-weight:500;color:var(--blue);text-decoration:none;transition:var(--transition);
}
.deep-link:hover { background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.3);transform:translateY(-1px); }
.deep-link .dl-icon { font-size:13px; }
.deep-link .dl-label { font-size:10px;color:var(--text2);margin-left:2px; }

.link-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px; }
.link-card {
  display:flex;flex-direction:column;align-items:center;padding:14px 10px;
  background:rgba(0,0,0,0.02);border-radius:var(--radius-sm);
  text-decoration:none;color:var(--text);transition:var(--transition);border:0.5px solid transparent;
}
.link-card:hover { background:rgba(0,122,255,0.06);border-color:rgba(0,122,255,0.15); }
.link-card .lk-icon { font-size:26px;margin-bottom:6px; }
.link-card .lk-name { font-size:12px;font-weight:500; }
.link-card .lk-desc { font-size:10px;color:var(--text3);margin-top:2px; }

/* For timeline */
.timeline { display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:8px 0; }
.timeline .tl-node { flex-shrink:0;text-align:center;padding:8px 12px;position:relative;min-width:90px; }
.timeline .tl-node::after { content:'';position:absolute;top:50%;right:-6px;width:12px;height:1px;background:var(--bdr); }
.timeline .tl-node:last-child::after { display:none; }
.timeline .tl-dot { width:10px;height:10px;border-radius:50%;margin:0 auto 4px; }
.timeline .tl-label { font-size:9px;color:var(--text3); }
.timeline .tl-phase { font-size:10px;font-weight:600; }
</style></head><body>

<div class="sidebar">
  <div class="side-hd"><div class="side-icon">投</div><div><div class="st">投研体系</div><div class="sv">v1.8 · 统一门户</div></div></div>
  <div class="side-nav" id="sideNav">
    <button class="side-btn" data-tab="overview"><span class="sb-icon">◉</span> 总览<span class="sb-badge">核心</span></button>
    <button class="side-btn active" data-tab="macro"><span class="sb-icon">⊡</span> 宏观研判<span class="sb-badge">定位</span></button>
    <button class="side-btn" data-tab="alloc"><span class="sb-icon">◈</span> 资产配置</button>
    <button class="side-btn" data-tab="risk"><span class="sb-icon">⊕</span> 风险监控</button>
    <button class="side-btn" data-tab="perf"><span class="sb-icon">⊿</span> 绩效评估</button>
    <button class="side-btn" data-tab="tools"><span class="sb-icon">⊞</span> 工具支撑</button>
  </div>
  <div class="side-ft">Wind + SQLite · 37/73 实时<br/>GitHub Pages 在线部署</div>
</div>

<div class="main-wrap">
  <div class="topbar">
    <div class="traffic"><span class="tr"></span><span class="ty"></span><span class="tg"></span></div>
    <div class="tp-title" id="pageTitle">宏观研判 — 经济周期定位</div>
    <div class="tp-meta">
      <span>TAA <b style="color:var(--green)">+0.34</b></span>
      <span>覆盖 <b>37/73</b></span>
      <span>SAA <b>+14.0%</b></span>
      <span>2026-08-09</span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ===== Data =====
var DATA = {
  taa: {政策:2,估值:-1,技术:-1,资金:1,宏观:0},
  pe: {沪深300:{pe:14.4,pct:95},中证500:{pe:35.2,pct:90},创业板:{pe:42.2,pct:65},科创50:{pe:196,pct:98},上证50:{pe:11.7,pct:90}},
  macro: {gdp:4.3,pmi:49.2,cpi:1.0,m1m2:-4.0,sr:7.4,ex:23.9,ip:5.3,fa:-5.7,rs:1.0},
  saa: {ret:14.0,vol:9.5,sharpe:1.48,calmar:1.64,maxdd:-8.5,var99:-4.82,excess:2.0},
  alloc: {信用债:27,利率债:9,现金:10,沪深300:3,创业板:9,标普500:23,黄金:21}
};

// GDP & CPI history for Merrill Clock
var gdpHistory = [
  {q:'2023-Q3',gdp:5.0,cpi:0.1},{q:'2023-Q4',gdp:5.3,cpi:-0.3},{q:'2024-Q1',gdp:5.3,cpi:0.0},
  {q:'2024-Q2',gdp:4.7,cpi:0.3},{q:'2024-Q3',gdp:4.6,cpi:0.6},{q:'2024-Q4',gdp:5.4,cpi:0.4},
  {q:'2025-Q1',gdp:5.4,cpi:0.0},{q:'2025-Q2',gdp:5.2,cpi:0.3},{q:'2025-Q3',gdp:4.8,cpi:0.7},
  {q:'2025-Q4',gdp:4.5,cpi:0.4},{q:'2026-Q1',gdp:5.0,cpi:0.1},{q:'2026-Q2',gdp:4.3,cpi:0.8}
];

// Three-cycle scores: normalized -2 to +2 scale
// Economic: from GDP growth (target 5% = 0, above = +, below = -)
// Credit: from M1-M2 spread (0 = neutral, negative = tight)
// Rate: from 10Y level (around 2.5% = neutral, below = easing)
var threeCycleNow = { economic: -1.0, credit: -1.5, rate: 1.5 };

var titles = { overview:'总览 — 投研体系 v1.8', macro:'宏观研判 — 经济周期定位', alloc:'资产配置 — SAA + TAA', risk:'风险监控 — 五类风险 · 三级限额', perf:'绩效评估 — Brinson归因 · 多周期', tools:'工具支撑 — 数据管线 · 外部看板' };

// ===== Tab Switching =====
document.querySelectorAll('.side-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var tab = this.dataset.tab;
    document.querySelectorAll('.side-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById('pageTitle').textContent = titles[tab] || tab;
    document.getElementById('content').innerHTML = renderTab(tab);
    if(tab==='overview') setTimeout(initOverviewCharts,200);
    if(tab==='macro') setTimeout(initMacroCharts,200);
    if(tab==='alloc') setTimeout(initAllocCharts,200);
    if(tab==='risk') setTimeout(initRiskCharts,200);
    if(tab==='perf') setTimeout(initPerfCharts,200);
  });
});

function renderTab(t){
  var r = {overview:renderOverview,macro:renderMacro,alloc:renderAlloc,risk:renderRisk,perf:renderPerf,tools:renderTools};
  return r[t]();
}

function toggleSec(el){ el.classList.toggle('open'); }

function macCard(title, val, desc, cls, label, vc){
  var vColor = vc || (cls==='pill-green'?'var(--green)':cls==='pill-red'?'var(--red)':cls==='pill-orange'?'var(--orange)':'var(--blue)');
  return '<div class="mac-card"><div class="mc-row1"><span class="mc-title">'+title+'</span><span class="mc-val" style="color:'+vColor+'">'+val+'</span></div><div class="mc-desc">'+desc+'</div><div class="mc-tags"><span class="pill '+cls+'">'+label+'</span></div></div>';
}
function section(title, open){
  var o = open ? ' open' : '';
  return '<div class="section"><div class="sec-hd'+o+'" onclick="toggleSec(this)"><span class="sh-title">'+title+'</span><span class="sh-chevron">▸</span></div><div class="sec-bd'+o+'">';
}
function secEnd(){ return '</div></div>'; }

// ===== MACRO =====
function renderMacro(){
  var h = '';

  // --- CYCLE JUDGMENT HERO ---
  h += '<div class="cycle-hero">';
  h += '<div class="ch-row">';
  h += '<div class="ch-phase">🔄 周期相位：经济下行 + 政策宽松期</div>';
  h += '<div class="ch-desc">';
  h += '<b>GDP 4.3%</b>（目标5%）+ <b>PMI 49.2</b>（收缩）= 增长偏弱 · ';
  h += '<b>CPI 1.0%</b>（低通胀）+ <b>10Y 1.71%</b>（历史低位）= 通缩压力 · ';
  h += '<b>M1−M2 −4.0pp</b>（资金沉淀）= 信用传导不畅<br/>';
  h += '<span style="color:var(--orange)">核心矛盾: 货币政策极度宽松 vs 实体经济需求不足</span>';
  h += '</div>';
  h += '</div>';

  // Model consensus row
  h += '<div class="ch-models" style="margin-top:12px;">';
  h += '<div class="ch-model">';
  h += '<div class="cm-name">美林时钟</div>';
  h += '<div class="cm-phase" style="color:var(--orange)">弱衰退 / 复苏初期</div>';
  h += '<div class="cm-bar"><div class="cm-fill" style="width:35%;background:var(--orange)"></div></div>';
  h += '<div style="font-size:9px;color:var(--text3);margin-top:2px">低增长 + 低通胀象限</div>';
  h += '</div>';

  h += '<div class="ch-model">';
  h += '<div class="cm-name">三周期模型</div>';
  h += '<div class="cm-phase" style="color:var(--purple)">下行+紧信用+宽货币</div>';
  h += '<div class="cm-bar"><div class="cm-fill" style="width:45%;background:var(--purple)"></div></div>';
  h += '<div style="font-size:9px;color:var(--text3);margin-top:2px">经济↓ 信用↓ 利率↓</div>';
  h += '</div>';

  h += '<div class="ch-model">';
  h += '<div class="cm-name">大类资产映射</div>';
  h += '<div class="cm-phase" style="color:var(--green)">债券 > 黄金 > 股票</div>';
  h += '<div class="cm-bar"><div class="cm-fill" style="width:60%;background:var(--green)"></div></div>';
  h += '<div style="font-size:9px;color:var(--text3);margin-top:2px">防御 > 进攻 · 等待复苏信号</div>';
  h += '</div>';

  h += '<div class="ch-model">';
  h += '<div class="cm-name">政策对冲力度</div>';
  h += '<div class="cm-phase" style="color:var(--green)">强烈宽松</div>';
  h += '<div class="cm-bar"><div class="cm-fill" style="width:85%;background:var(--green)"></div></div>';
  h += '<div style="font-size:9px;color:var(--text3);margin-top:2px">大基金三期 + 降息可期</div>';
  h += '</div>';
  h += '</div>';
  h += '</div>'; // end cycle-hero

  // --- KEY INDICATOR CARDS ---
  h += '<div class="card-grid">';
  var d = DATA.macro;
